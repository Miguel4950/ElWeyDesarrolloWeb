<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Clientes', 'admin-clientes.css')}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes - Restaurante El Wey</title>
</head>

<body class="bg-[#12100f] text-[#fcf2e9] min-vh-100 d-flex flex-column">
    <header th:replace="~{fragmentos :: navbar}"></header>

    <main class="flex-grow-1 py-5">
        <div class="container-fluid px-3 px-lg-5">
            <div class="mx-auto" style="max-width: 1200px;">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                    <div>
                        <p class="text-uppercase mb-2 fw-bold tracking-wide text-[#ee1a0e]"
                            style="letter-spacing: 0.22em; font-size: .72rem;">
                            Administración
                        </p>
                        <h1 class="display-6 fw-bold text-[#fcf2e9] mb-0"
                            style="font-family: 'Abril Fatface', Georgia, serif;">
                            Clientes registrados
                        </h1>
                    </div>

                    <span
                        class="badge rounded-pill px-3 py-2 text-bg-dark border border-secondary-subtle text-[#fcf2e9]">
                        Total: <span th:text="${#lists.size(clientes)}">0</span>
                    </span>
                </div>

                <div class="row g-4" th:if="${clientes != null and !#lists.isEmpty(clientes)}">
                    <div class="col-12 col-md-6 col-xl-4" th:each="cliente : ${clientes}">
                        <article class="card h-100 border-0 shadow-lg"
                            style="background-color: #1a1716; border: 1px solid #2d2422 !important;">
                            <div class="card-body p-4 d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                                    <div>
                                        <p class="text-uppercase mb-1 text-[#ee1a0e] fw-semibold"
                                            style="letter-spacing: 0.14em; font-size: .66rem;">
                                            Cliente
                                        </p>
                                        <h2 class="h4 mb-0 text-[#fcf2e9] fw-bold" th:text="${cliente.nombre}">Nombre
                                        </h2>
                                    </div>
                                    <span class="badge rounded-pill px-2 py-1 border border-secondary text-[#fcf2e9]"
                                        style="background-color: #12100f;">
                                        ID <span th:text="${cliente.id}">1</span>
                                    </span>
                                </div>

                                <div class="mt-3 space-y-3">
                                    <div class="d-flex align-items-start gap-3">
                                        <span class="fw-semibold text-[#a89f91]" style="min-width: 82px;">Correo</span>
                                        <span class="text-[#fcf2e9]"
                                            th:text="${cliente.correo}">correo@ejemplo.com</span>
                                    </div>

                                    <div class="d-flex align-items-start gap-3">
                                        <span class="fw-semibold text-[#a89f91]" style="min-width: 82px;">Tel.</span>
                                        <span class="text-[#fcf2e9]" th:text="${cliente.telefono}">300 000 0000</span>
                                    </div>

                                    <div class="d-flex align-items-start gap-3">
                                        <span class="fw-semibold text-[#a89f91]" style="min-width: 82px;">Dir.</span>
                                        <span class="text-[#fcf2e9]" th:text="${cliente.direccion}">Dirección</span>
                                    </div>

                                    <div class="d-flex align-items-start gap-3">
                                        <span class="fw-semibold text-[#a89f91]" style="min-width: 82px;">Desde</span>
                                        <span class="text-[#fcf2e9]"
                                            th:text="${cliente.fechaRegistro}">2026-01-10</span>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </div>

                <div th:if="${clientes == null or #lists.isEmpty(clientes)}" class="text-center py-5">
                    <div class="card border-0" style="background-color: #1a1716; border: 1px solid #2d2422 !important;">
                        <div class="card-body py-5">
                            <h2 class="h4 text-[#fcf2e9] mb-2">No hay clientes registrados</h2>
                            <p class="text-[#a89f91] mb-0">Aún no se ha creado ninguna cuenta en la plataforma.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragmentos :: calaveras}"></div>
    <footer th:replace="~{fragmentos :: footer}"></footer>
    <div th:replace="~{fragmentos :: scripts}"></div>
</body>

</html>
