<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head(${isEdicion} ? 'Editar Plato' : 'Crear Plato', 'crear-plato.css')}">
    <meta charset="UTF-8" />
    <title th:text="${isEdicion} ? 'Editar Plato - Restaurante El Wey' : 'Crear Plato - Restaurante El Wey'">Crear Plato
        - Restaurante El Wey</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/crear-plato.css" />
</head>

<body class="pagina-crear-plato">

    <!-- Barra de Navegación Reutilizable -->
    <header th:replace="~{fragmentos :: navbar}"></header>

    <main class="main-crear-plato">
        <div class="crear-plato-container">

            <!-- =========================================================================
                 TARJETA DEL FORMULARIO
                 ========================================================================= -->
            <div class="crear-plato-card">

                <!-- Encabezado de la tarjeta -->
                <div class="crear-plato-header">
                    <h2 class="crear-plato-titulo" th:text="${isEdicion} ? 'Editar Plato' : 'Nuevo Plato'">Nuevo Plato
                    </h2>
                </div>

                <div class="crear-plato-divider"></div>

                <!-- =====================================================================
                     FORMULARIO DE CREACION
                     [VARIABLE THYMELEAF]: th:object="${comida}" vincula el objeto Comida
                     ===================================================================== -->
                <form th:action="@{/comidas/guardar}" th:object="${comida}" method="post" class="crear-plato-form">
                    <input type="hidden" th:field="*{id}" />

                    <!-- Campo 1: Nombre -->
                    <div class="campo-grupo">
                        <label for="nombre" class="campo-label">NOMBRE</label>
                        <!-- [VARIABLE: th:field="*{nombre}"] -->
                        <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Tacos al Pastor"
                            class="campo-input" />
                        <!-- [VARIABLE: th:if="${#fields.hasErrors('nombre')}"] -->
                        <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="campo-error"></span>
                    </div>

                    <!-- Campo 2: Descripción -->
                    <div class="campo-grupo">
                        <label for="descripcion" class="campo-label">DESCRIPCIÓN</label>
                        <!-- [VARIABLE: th:field="*{descripcion}"] -->
                        <textarea id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Describe el plato..."
                            class="campo-input campo-textarea"></textarea>
                        <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"
                            class="campo-error"></span>
                    </div>

                    <!-- Fila: Precio + Categoría -->
                    <div class="fila-dos-campos">

                        <!-- Campo 3: Precio (COP) -->
                        <div class="campo-grupo">
                            <label for="precio" class="campo-label">PRECIO (COP)</label>
                            <!-- [VARIABLE: th:field="*{precio}"] -->
                            <input type="number" id="precio" th:field="*{precio}" placeholder="22000" min="0"
                                class="campo-input" />
                            <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"
                                class="campo-error"></span>
                        </div>

                        <!-- Campo 4: Categoría (select dinámico desde el controlador) -->
                        <div class="campo-grupo">
                            <label for="categoriaId" class="campo-label">CATEGORÍA</label>
                            <select id="categoriaId" name="categoriaId" class="campo-input campo-select">
                                <option value="" disabled selected th:if="${categoriaActualId == null}">Selecciona...
                                </option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"
                                    th:selected="${cat.id == categoriaActualId}">
                                    Estrella
                                </option>
                            </select>
                        </div>
                    </div>


                    <div class="fila-dos-campos">
                        <!-- Campo 5: Etiqueta -->
                        <div class="campo-grupo">
                            <label for="etiqueta" class="campo-label">ETIQUETA</label>
                            <input type="text" id="etiqueta" th:field="*{etiqueta}"
                                placeholder="Ej: Estrella, Top Ventas" class="campo-input" />
                        </div>

                        <!-- Campo 6: Activo -->
                        <div class="campo-grupo">
                            <label for="activo" class="campo-label">ESTADO</label>
                            <select id="activo" th:field="*{activo}" class="campo-input campo-select">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <!-- Campo 7: URL de Imagen -->
                    <div class="campo-grupo">
                        <label for="imagenUrl" class="campo-label">URL DE IMAGEN</label>
                        <!-- [VARIABLE: th:field="*{imagenUrl}"] -->
                        <input type="url" id="imagenUrl" th:field="*{imagenUrl}"
                            placeholder="https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=600&h=400"
                            class="campo-input" />
                        <span th:if="${#fields.hasErrors('imagenUrl')}" th:errors="*{imagenUrl}"
                            class="campo-error"></span>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="crear-plato-acciones">
                        <a th:href="@{/admin/productos}" class="btn-cancelar">
                            CANCELAR
                        </a>
                        <button type="submit" class="btn-crear"
                            th:text="${isEdicion} ? 'GUARDAR CAMBIOS' : 'CREAR PLATO'">
                            CREAR PLATO
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </main>

    <!-- Borde Papel Picado -->
    <div th:replace="~{fragmentos :: calaveras}"></div>

    <!-- Pie de Página Reutilizable -->
    <footer th:replace="~{fragmentos :: footer}"></footer>

    <!-- Bootstrap JS Bundle -->
    <script th:replace="~{fragmentos :: scripts}"></script>

</body>

</html>
