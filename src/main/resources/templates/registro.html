<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Crear Cuenta', 'registro.css')}">
    <meta charset="UTF-8" />
    <title>Crear Cuenta - Restaurante El Wey</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/registro.css" />
</head>

<body class="bg-dark text-light">
    <header th:replace="~{fragmentos :: navbar}"></header>

    <main class="registro-main py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="registro-card card border-0 shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <span class="d-block text-uppercase small fw-bold text-danger mb-2">Registro</span>
                                <h1 class="h2 fw-bold text-light mb-2">Crear Cuenta</h1>
                                <p class="text-secondary mb-0">
                                    Regístrate para realizar pedidos y gestionar tus entregas
                                </p>
                            </div>

                            <form th:action="@{/registro}" method="post" th:object="${cliente}"
                                class="row g-3 needs-validation">
                                <div th:if="${error != null or param.error != null}" class="alerta-error col-12">
                                    <svg class="alerta-icono" fill="currentColor" viewBox="0 0 20 20">
                                        <path fill-rule="evenodd"
                                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    <span
                                        th:text="${errorMessage} ?: 'Ocurrió un error al registrar la cuenta. Por favor verifica tus datos.'">
                                        Error al crear la cuenta. Inténtalo de nuevo.
                                    </span>
                                </div>

                                <div th:if="${mensaje != null or param.exito != null}" class="alerta-exito col-12">
                                    <span th:text="${mensaje} ?: '¡Cuenta creada con éxito! Ya puedes iniciar sesión.'">
                                        ¡Cuenta creada con éxito!
                                    </span>
                                </div>

                                <div class="col-12">
                                    <label for="nombre" class="form-label text-uppercase small text-secondary">Nombre
                                        Completo</label>
                                    <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Carlos Santana"
                                        required class="form-control" />
                                </div>

                                <div class="col-12">
                                    <label for="correo" class="form-label text-uppercase small text-secondary">Correo
                                        Electrónico</label>
                                    <input type="email" id="correo" th:field="*{correo}"
                                        placeholder="nombre@ejemplo.com" required class="form-control" />
                                </div>

                                <div class="col-12">
                                    <label for="password"
                                        class="form-label text-uppercase small text-secondary">Contraseña</label>
                                    <input type="password" id="password" th:field="*{password}" placeholder="••••••••"
                                        required class="form-control" />
                                </div>

                                <div class="col-md-6">
                                    <label for="telefono"
                                        class="form-label text-uppercase small text-secondary">Teléfono</label>
                                    <input type="tel" id="telefono" th:field="*{telefono}" placeholder="300 123 4567"
                                        required class="form-control" />
                                </div>

                                <div class="col-md-6">
                                    <label for="direccion"
                                        class="form-label text-uppercase small text-secondary">Dirección</label>
                                    <input type="text" id="direccion" th:field="*{direccion}"
                                        placeholder="Calle 123 # 45-67" required class="form-control" />
                                </div>

                                <div class="col-12">
                                    <label for="rol" class="form-label text-uppercase small text-secondary">Perfil /
                                        Rol</label>
                                    <select id="rol" name="rol" class="form-select">
                                        <option value="CLIENTE"
                                            th:selected="${selectedRol == 'CLIENTE' or selectedRol == null}">Cliente
                                        </option>
                                        <option value="OPERADOR" th:selected="${selectedRol == 'OPERADOR'}">Operador
                                        </option>
                                        <option value="ADMIN" th:selected="${selectedRol == 'ADMIN'}">Admin</option>
                                    </select>
                                </div>

                                <div class="col-12 mt-2">
                                    <button type="submit" class="btn btn-submit-registro btn-danger w-100">
                                        Registrarme
                                    </button>
                                </div>
                            </form>

                            <div class="registro-footer-box text-center mt-4 pt-3 border-top border-secondary-subtle">
                                <a th:href="@{/login}" href="/login"
                                    class="link-login text-decoration-none text-uppercase small fw-semibold">
                                    ¿Ya tienes cuenta? Inicia sesión
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragmentos :: calaveras}"></div>
    <footer th:replace="~{fragmentos :: footer}"></footer>
    <a href="#ayuda" title="Ayuda / Soporte" class="btn-flotante-ayuda">?</a>
    <div th:replace="~{fragmentos :: scripts}"></div>
</body>

</html>
