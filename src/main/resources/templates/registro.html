<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head('Crear Cuenta', 'login.css')}">
    <meta charset="UTF-8" />
    <title>Crear Cuenta - Restaurante El Wey</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body class="bg-[#12100f] text-[#fcf2e9]">

    <!-- Barra de Navegación Reutilizable -->
    <header th:replace="~{fragmentos :: navbar}"></header>

    <!-- Contenedor Principal: Misma estructura que Iniciar Sesión -->
    <main class="login-main">

        <!-- Tarjeta de Registro estilo El Wey -->
        <div class="login-card" style="max-width: 480px;">

            <!-- Encabezado de la Tarjeta -->
            <div class="login-header">
                <span class="login-subtitle">
                    Registro de Cuenta
                </span>
                <h1 class="login-title">
                    Crear Cuenta
                </h1>
                <p class="login-desc">
                    Regístrate para realizar pedidos y gestionar tus entregas
                </p>
            </div>

            <!-- Formulario de Registro -->
            <form th:action="@{/registro}" method="post" th:object="${cliente}" class="form-login" autocomplete="off">

                <!-- Mensaje de Error si ya existe el correo o datos inválidos -->
                <div th:if="${error != null or param.error != null}" class="alerta-error">
                    <svg class="alerta-icono" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd"
                            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
                            clip-rule="evenodd" />
                    </svg>
                    <span th:text="${errorMessage} ?: 'Ocurrió un error al registrar la cuenta. Por favor verifica tus datos.'">
                        Error al crear la cuenta. Inténtalo de nuevo.
                    </span>
                </div>

                <!-- Mensaje de Éxito -->
                <div th:if="${mensaje != null or param.exito != null}" class="alerta-exito">
                    <span th:text="${mensaje} ?: '¡Cuenta creada con éxito! Ya puedes iniciar sesión.'">
                        ¡Cuenta creada con éxito!
                    </span>
                </div>

                <!-- Campo 1: Nombre Completo -->
                <div class="form-grupo">
                    <label for="nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="nombre" th:field="*{nombre}" autocomplete="off" placeholder="Ej. Carlos Santana"
                        required class="form-input" />
                </div>

                <!-- Campo 2: Correo Electrónico -->
                <div class="form-grupo">
                    <label for="correo" class="form-label">Correo Electrónico</label>
                    <input type="email" id="correo" th:field="*{correo}" autocomplete="off" placeholder="nombre@ejemplo.com"
                        required class="form-input" />
                </div>

                <!-- Campo 3: Contraseña -->
                <div class="form-grupo">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password" placeholder="••••••••"
                        required class="form-input" />
                </div>

                <!-- Campos 4 y 5 en dos columnas: Teléfono y Dirección -->
                <div class="form-fila-dos">
                    <div class="form-grupo">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" id="telefono" th:field="*{telefono}" autocomplete="off" placeholder="300 123 4567"
                            required class="form-input" />
                    </div>

                    <div class="form-grupo">
                        <label for="direccion" class="form-label">Dirección</label>
                        <input type="text" id="direccion" th:field="*{direccion}" autocomplete="off" placeholder="Calle 123 # 45-67"
                            required class="form-input" />
                    </div>
                </div>

                <!-- Rol automático fijado a CLIENTE -->
                <input type="hidden" name="rol" value="CLIENTE" />

                <!-- Botón de Envío -->
                <button type="submit" id="btn-submit-registro" class="btn-submit-login">
                    REGISTRARME
                </button>
            </form>

            <!-- Enlace inferior para ir a Login -->
            <div class="login-footer-box">
                <a th:href="@{/login}" href="/login" class="link-registro">
                    ¿Ya tienes cuenta? Inicia sesión aquí
                </a>
            </div>

        </div>
    </main>

    <!-- Borde Inferior de Calaveras -->
    <div th:replace="~{fragmentos :: calaveras}"></div>

    <!-- Pie de Página Reutilizable -->
    <footer th:replace="~{fragmentos :: footer}"></footer>

    <!-- Botón Flotante de Ayuda (?) -->
    <a href="#ayuda" title="Ayuda / Soporte" class="btn-flotante-ayuda">?</a>

    <!-- Scripts Reutilizables de Bootstrap -->
    <div th:replace="~{fragmentos :: scripts}"></div>

    <script>
        // Asegurar que los campos inicien completamente vacíos y no se autocompleten por el navegador
        function limpiarCamposRegistro() {
            var errorAlert = document.querySelector('.alerta-error');
            if (!errorAlert) {
                var campos = ['nombre', 'correo', 'password', 'telefono', 'direccion'];
                campos.forEach(function(id) {
                    var el = document.getElementById(id);
                    if (el) el.value = '';
                });
            }
        }
        document.addEventListener('DOMContentLoaded', limpiarCamposRegistro);
        window.addEventListener('pageshow', limpiarCamposRegistro);
    </script>

</body>

</html>
